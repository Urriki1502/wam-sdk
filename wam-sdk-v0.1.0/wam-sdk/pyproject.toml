[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-sdk"
version = "0.1.0"
description = "Independent privacy-oriented WAM Python SDK with exact amounts and payment observations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wam_sdk = ["py.typed"]
